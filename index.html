<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>El juego de Olympia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        background: #160c24;
        overflow: hidden;
        font-family: Fredoka, Comic Sans MS, sans-serif;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        overscroll-behavior: none;
        -webkit-touch-callout: none;
      }
      #game {
        width: 100%;
        height: 100%;
        height: 100dvh;
      }
      canvas { display: block; }
      #portada, #banner {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 40;
      }
      #portada { pointer-events: none; }
      #portada.open { display: block; pointer-events: auto; }
      .portada-copy {
        position: absolute;
        left: 4%;
        top: 6%;
        width: min(56%, 580px);
        color: #fff7fb;
        text-shadow: 0 2px 8px rgba(20, 8, 30, 0.8);
        pointer-events: none;
      }
      .portada-copy h2 {
        margin: 0;
        font-size: clamp(22px, 6vh, 52px);
        color: #ffd76a;
      }
      .portada-copy .presentan {
        margin: 4px 0 10px;
        font-size: clamp(16px, 4.2vh, 36px);
      }
      .portada-copy h1 {
        margin: 0 0 8px;
        font-size: clamp(28px, 10vh, 84px);
        line-height: 1.02;
        color: #ff7ab6;
        text-shadow: 0 4px 0 #fff, 0 8px 16px rgba(0,0,0,.3);
      }
      .portada-copy .sub { margin: 0 0 16px; font-size: clamp(14px, 3.4vh, 30px); }
      #btn-jugar, #banner-ok {
        pointer-events: auto;
        appearance: none;
        border: 4px solid #fff;
        border-radius: 18px;
        padding: 10px 36px;
        font: 700 clamp(22px, 5vh, 40px) Fredoka, sans-serif;
        cursor: pointer;
        background: #ff7ab6;
        color: #fff;
        box-shadow: 0 6px 0 #b63d7a;
      }
      #btn-jugar:hover, #banner-ok:hover { transform: scale(1.04); }
      .hint {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        margin: 0;
        padding: 10px 20px calc(12px + env(safe-area-inset-bottom, 0px));
        text-align: center;
        font-size: clamp(16px, 3.6vh, 24px);
        color: #fff7fb;
        background: linear-gradient(transparent, rgba(16, 8, 28, 0.78));
        text-shadow: 0 2px 8px rgba(20, 8, 30, 0.85);
        pointer-events: none;
      }
      #banner {
        background: rgba(16, 8, 28, 0.45);
        display: none;
        align-items: center;
        justify-content: center;
      }
      #banner.open { display: flex; }
      .banner-card {
        width: min(90vw, 460px);
        background: #2a1844;
        border: 6px solid #ffd76a;
        border-radius: 20px;
        padding: 22px 24px 20px;
        text-align: center;
        color: #ffd76a;
      }
      .banner-card h2 {
        margin: 0 0 10px;
        font-size: clamp(22px, 5vh, 36px);
        line-height: 1.25;
        color: #ffd76a;
      }
      .banner-score {
        margin: 0 0 18px;
        font-size: clamp(18px, 4vh, 30px);
        color: #fff7fb;
      }
      #gira {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 80;
        background: #160c24;
        color: #fff7fb;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 12px;
        text-align: center;
        padding: 28px;
      }
      #gira p {
        margin: 0;
        font-size: clamp(22px, 6vw, 32px);
        font-weight: 700;
      }
      #gira span { font-size: 52px; }
      @media (orientation: portrait) and (max-width: 900px) {
        #gira { display: flex; }
        #portada.open { display: none; }
      }
      #touch {
        display: none;
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 30;
        height: calc(76px + env(safe-area-inset-bottom, 0px));
        padding: 0 12px env(safe-area-inset-bottom, 0px);
        box-sizing: border-box;
        align-items: center;
        justify-content: space-between;
        pointer-events: none;
        background: linear-gradient(transparent, rgba(16, 8, 28, 0.55));
      }
      #touch.open {
        display: flex;
        pointer-events: auto;
      }
      .touch-left {
        display: flex;
        gap: 10px;
      }
      #touch button {
        appearance: none;
        border: 3px solid #fff;
        border-radius: 50%;
        width: 64px;
        height: 64px;
        font: 700 28px Fredoka, sans-serif;
        color: #5b2b16;
        background: rgba(255, 215, 106, 0.92);
        box-shadow: 0 4px 0 #b8860b;
        touch-action: manipulation;
      }
      #touch button:active {
        transform: scale(0.94);
        background: #ffe38a;
      }
      #touch-jump {
        width: 72px;
        height: 72px;
        font-size: 32px;
        background: rgba(255, 122, 182, 0.94);
        box-shadow: 0 4px 0 #b63d7a;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="portada">
      <div class="portada-copy">
        <h2>Tía Ivana y Tío Alfredo</h2>
        <p class="presentan">presentan</p>
        <h1>El juego de Olympia</h1>
        <p class="sub">Una aventura en el castillo de las hadas</p>
        <button id="btn-jugar" type="button">¡Jugar!</button>
      </div>
      <p class="hint">Tocá la pantalla para música · subí el volumen del iPhone · pantalla apaisada</p>
    </div>
    <audio id="oly-bgm" loop playsinline webkit-playsinline preload="auto" src="assets/sfx/intro.mp3"></audio>
    <div id="banner">
      <div class="banner-card">
        <h2 id="banner-title">Pausa</h2>
        <p id="banner-score" class="banner-score"></p>
        <button id="banner-ok" type="button">Seguir</button>
      </div>
    </div>
    <div id="gira">
      <span>↻</span>
      <p>Girá el celular</p>
      <p>Jugá con la pantalla apaisada</p>
    </div>
    <div id="touch" aria-hidden="true">
      <div class="touch-left">
        <button type="button" data-dir="-1" aria-label="Izquierda">◀</button>
        <button type="button" data-dir="1" aria-label="Derecha">▶</button>
      </div>
      <button type="button" id="touch-jump" aria-label="Saltar">▲</button>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
