<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Oly Aventura" />
    <meta name="theme-color" content="#0a0014" />
    <meta name="description" content="El juego de Olympia en el castillo de hadas" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <title>El juego de Olympia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        background: #0a0014;
        overflow: hidden;
        font-family: Fredoka, Comic Sans MS, sans-serif;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        overscroll-behavior: none;
        -webkit-touch-callout: none;
      }
      #game {
        width: 100%;
        height: 100%;
        height: 100dvh;
      }
      canvas { display: block; }

      /* —— Portada arcade 80s —— */
      #portada, #banner {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 40;
      }
      #portada { pointer-events: none; }
      #portada.open { display: block; pointer-events: auto; }

      .arcade-cabinet {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse 80% 60% at 50% 100%, rgba(255, 0, 110, 0.25), transparent 60%),
          radial-gradient(ellipse 60% 50% at 20% 20%, rgba(0, 245, 255, 0.12), transparent 50%),
          linear-gradient(180deg, #0a0014 0%, #1a0033 45%, #0d0020 100%);
        overflow: hidden;
      }
      .arcade-cabinet::before {
        content: '';
        position: absolute;
        inset: 0;
        background:
          repeating-linear-gradient(
            0deg,
            transparent,
            transparent 2px,
            rgba(0, 0, 0, 0.15) 2px,
            rgba(0, 0, 0, 0.15) 4px
          );
        pointer-events: none;
        z-index: 3;
      }
      .arcade-grid {
        position: absolute;
        left: -10%;
        right: -10%;
        bottom: 0;
        height: 45%;
        background:
          linear-gradient(transparent 0%, rgba(255, 0, 180, 0.08) 100%),
          repeating-linear-gradient(90deg, rgba(0, 245, 255, 0.15) 0 1px, transparent 1px 40px),
          repeating-linear-gradient(0deg, rgba(0, 245, 255, 0.15) 0 1px, transparent 1px 40px);
        transform: perspective(400px) rotateX(58deg);
        transform-origin: bottom center;
        opacity: 0.7;
      }
      .arcade-bezel {
        position: absolute;
        inset: 12px;
        border: 6px solid #2a1040;
        border-radius: 12px;
        box-shadow:
          inset 0 0 0 3px #ff006e,
          inset 0 0 40px rgba(255, 0, 110, 0.2),
          0 0 30px rgba(255, 0, 110, 0.3);
        pointer-events: none;
        z-index: 2;
      }
      .portada-layout {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 20px 24px 56px;
        z-index: 4;
        pointer-events: none;
      }
      .portada-copy {
        position: relative;
        left: auto;
        top: auto;
        transform: none;
        width: min(92%, 640px);
        text-align: center;
        color: #fff;
        pointer-events: none;
        flex-shrink: 0;
        line-height: 1.75;
      }
      .portada-photo-frame {
        position: relative;
        width: min(38vw, 440px);
        height: min(88vh, 780px);
        flex-shrink: 0;
        border: 5px solid #2a1040;
        border-radius: 10px;
        box-shadow:
          inset 0 0 0 3px #ff006e,
          inset 0 0 30px rgba(255, 0, 110, 0.25),
          0 0 40px rgba(255, 0, 110, 0.45),
          0 0 80px rgba(0, 245, 255, 0.15);
        overflow: hidden;
        background: #0a0014;
        display: flex;
        flex-direction: column;
      }
      .portada-player-label {
        flex-shrink: 0;
        height: 52px;
        background: #0a0014;
        display: flex;
        align-items: center;
        justify-content: center;
        padding-bottom: 14px;
        box-sizing: border-box;
        font-family: 'Press Start 2P', monospace;
        font-size: clamp(11px, 2.4vh, 16px);
        color: #ffea00;
        text-shadow: 0 0 10px #ffea00;
        letter-spacing: 0.12em;
        z-index: 4;
      }
      .portada-player-label span {
        animation: blink 1.4s step-end infinite;
      }
      .portada-photo-frame::after {
        display: none;
      }
      .portada-photo-pixel {
        flex: 1;
        width: 100%;
        min-height: 0;
        overflow: hidden;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 10px 8px 0;
        box-sizing: border-box;
      }
      .portada-photo-pixel img {
        width: auto;
        height: 22%;
        max-width: none;
        object-fit: contain;
        object-position: center 18%;
        transform: scale(4.4) translateY(-7%);
        transform-origin: center center;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        filter: contrast(1.15) saturate(1.25) brightness(1.05);
      }
      .portada-photo-scan {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 52px;
        background: repeating-linear-gradient(
          0deg,
          transparent,
          transparent 3px,
          rgba(0, 0, 0, 0.18) 3px,
          rgba(0, 0, 0, 0.18) 5px
        );
        pointer-events: none;
        z-index: 2;
      }
      .portada-photo-glow {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 52px;
        background: radial-gradient(ellipse at 50% 30%, rgba(255, 0, 110, 0.12), transparent 65%);
        pointer-events: none;
        z-index: 2;
      }
      @media (orientation: landscape) {
        .portada-layout {
          flex-direction: row;
          align-items: center;
          justify-content: center;
          gap: 32px;
          padding: 24px 6% 56px;
        }
        .portada-copy {
          width: min(44%, 480px);
          flex: 0 1 auto;
          margin: 0;
        }
        .portada-photo-frame {
          position: relative;
          right: auto;
          top: auto;
          transform: none;
          width: min(36vw, 460px);
          height: min(88vh, 780px);
        }
      }
      @media (orientation: portrait) and (max-width: 820px) {
        .portada-layout {
          flex-direction: column;
          justify-content: center;
          padding-bottom: 48px;
        }
        .portada-copy {
          width: 100%;
          text-align: center;
        }
        .portada-photo-frame {
          width: min(52vw, 300px);
          height: min(58vh, 500px);
        }
      }
      .arcade-credit {
        font-family: 'Press Start 2P', monospace;
        font-size: clamp(11px, 2.8vh, 18px);
        color: #ffea00;
        letter-spacing: 0.12em;
        margin: 0 0 22px;
        line-height: 1.85;
        animation: blink 1.1s step-end infinite;
      }
      .portada-copy .presentan {
        margin: 0 0 18px;
        font-family: 'Press Start 2P', monospace;
        font-size: clamp(10px, 2.4vh, 15px);
        color: #00f5ff;
        letter-spacing: 0.08em;
        line-height: 1.85;
      }
      .portada-copy h1 {
        margin: 0 0 24px;
        font-family: 'Press Start 2P', monospace;
        font-size: clamp(22px, 6.5vh, 52px);
        line-height: 1.7;
        color: #ff006e;
        text-shadow:
          0 0 10px #ff006e,
          0 0 24px #ff006e,
          3px 3px 0 #00f5ff;
        animation: neon-pulse 2s ease-in-out infinite;
      }
      .portada-copy .sub {
        margin: 0 0 32px;
        font-family: 'Press Start 2P', monospace;
        font-size: clamp(10px, 2.5vh, 15px);
        color: #c77dff;
        line-height: 1.9;
      }
      .portada-copy h2 {
        display: none;
      }
      #btn-jugar, #banner-ok {
        pointer-events: auto;
        display: inline-block;
        appearance: none;
        border: none;
        border-radius: 8px;
        padding: 18px 40px;
        font-family: 'Press Start 2P', monospace;
        font-size: clamp(14px, 3.2vh, 22px);
        line-height: 1.6;
        cursor: pointer;
        color: #0a0014;
        background: linear-gradient(180deg, #ffea00 0%, #ff9500 100%);
        box-shadow:
          0 0 20px rgba(255, 234, 0, 0.6),
          0 6px 0 #b8860b,
          inset 0 2px 0 rgba(255, 255, 255, 0.4);
        animation: btn-glow 1.5s ease-in-out infinite;
      }
      #btn-jugar:active, #banner-ok:active {
        transform: translateY(4px);
        box-shadow: 0 2px 0 #b8860b;
      }
      #btn-install {
        pointer-events: auto;
        display: inline-block;
        appearance: none;
        border: 2px solid #00f5ff;
        border-radius: 8px;
        margin-top: 14px;
        padding: 12px 22px;
        font-family: 'Press Start 2P', monospace;
        font-size: clamp(8px, 1.8vh, 11px);
        line-height: 1.6;
        cursor: pointer;
        color: #00f5ff;
        background: rgba(10, 0, 30, 0.85);
        box-shadow: 0 0 16px rgba(0, 245, 255, 0.35);
      }
      #btn-install[hidden] {
        display: none !important;
      }
      #install-ios-hint {
        position: absolute;
        left: 16px;
        right: 16px;
        bottom: calc(52px + env(safe-area-inset-bottom, 0px));
        margin: 0;
        padding: 10px 14px;
        text-align: center;
        font-family: 'Press Start 2P', monospace;
        font-size: clamp(6px, 1.3vh, 8px);
        line-height: 1.7;
        color: #ffea00;
        background: rgba(10, 0, 30, 0.92);
        border: 2px solid #ff006e;
        border-radius: 8px;
        z-index: 6;
        pointer-events: none;
        text-shadow: 0 0 8px rgba(255, 234, 0, 0.5);
      }
      #install-ios-hint[hidden] {
        display: none !important;
      }
      .hint {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        margin: 0;
        padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
        text-align: center;
        font-family: 'Press Start 2P', monospace;
        font-size: clamp(6px, 1.4vh, 9px);
        line-height: 1.7;
        color: #00f5ff;
        background: linear-gradient(transparent, rgba(10, 0, 20, 0.9));
        text-shadow: 0 0 8px #00f5ff;
        pointer-events: none;
        z-index: 4;
      }
      #btn-mute-portada {
        position: absolute;
        top: calc(16px + env(safe-area-inset-top, 0px));
        right: calc(16px + env(safe-area-inset-right, 0px));
        z-index: 5;
        pointer-events: auto;
        appearance: none;
        border: 3px solid #00f5ff;
        border-radius: 8px;
        width: 48px;
        height: 48px;
        font-size: 22px;
        background: rgba(10, 0, 30, 0.85);
        box-shadow: 0 0 12px rgba(0, 245, 255, 0.4);
        cursor: pointer;
      }
      #btn-mute-portada.muted { border-color: #ff006e; box-shadow: 0 0 12px rgba(255, 0, 110, 0.4); }

      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.2; }
      }
      @keyframes neon-pulse {
        0%, 100% { filter: brightness(1); }
        50% { filter: brightness(1.15); }
      }
      @keyframes btn-glow {
        0%, 100% { box-shadow: 0 0 20px rgba(255, 234, 0, 0.5), 0 6px 0 #b8860b, inset 0 2px 0 rgba(255,255,255,0.4); }
        50% { box-shadow: 0 0 32px rgba(255, 234, 0, 0.85), 0 6px 0 #b8860b, inset 0 2px 0 rgba(255,255,255,0.4); }
      }

      /* —— Banner —— */
      #banner {
        background: rgba(10, 0, 20, 0.75);
        display: none;
        align-items: center;
        justify-content: center;
      }
      #banner.open { display: flex; }
      .banner-card {
        width: min(90vw, 460px);
        background: #1a0033;
        border: 4px solid #ff006e;
        border-radius: 8px;
        padding: 22px 24px 20px;
        text-align: center;
        box-shadow: 0 0 30px rgba(255, 0, 110, 0.4);
      }
      .banner-card h2 {
        margin: 0 0 10px;
        font-family: 'Press Start 2P', monospace;
        font-size: clamp(12px, 2.8vh, 18px);
        line-height: 1.5;
        color: #ffea00;
        white-space: pre-line;
      }
      .banner-score {
        margin: 0 0 18px;
        font-family: 'Press Start 2P', monospace;
        font-size: clamp(9px, 2vh, 12px);
        color: #00f5ff;
      }
      .banner-actions {
        display: flex;
        flex-direction: column;
        gap: 10px;
        align-items: center;
      }
      #banner-quit {
        pointer-events: auto;
        appearance: none;
        border: 3px solid #ff006e;
        border-radius: 8px;
        padding: 10px 20px;
        font-family: 'Press Start 2P', monospace;
        font-size: clamp(8px, 1.8vh, 10px);
        cursor: pointer;
        background: transparent;
        color: #ff006e;
        box-shadow: 0 0 12px rgba(255, 0, 110, 0.35);
      }
      #btn-exit-game {
        display: none;
        position: fixed;
        top: calc(12px + env(safe-area-inset-top, 0px));
        left: calc(12px + env(safe-area-inset-left, 0px));
        right: auto;
        z-index: 35;
        appearance: none;
        border: 3px solid #ff006e;
        border-radius: 8px;
        padding: 8px 12px;
        font-family: 'Press Start 2P', monospace;
        font-size: 9px;
        color: #ff006e;
        background: rgba(10, 0, 30, 0.88);
        box-shadow: 0 0 12px rgba(255, 0, 110, 0.35);
        cursor: pointer;
        pointer-events: auto;
      }
      #btn-exit-game.open { display: block; }

      /* —— Gira celular —— */
      #gira {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 80;
        background: #0a0014;
        color: #ff006e;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 12px;
        text-align: center;
        padding: 28px;
      }
      #gira p {
        margin: 0;
        font-family: 'Press Start 2P', monospace;
        font-size: clamp(10px, 3vw, 14px);
        line-height: 1.6;
      }
      #gira span { font-size: 52px; }
      @media (orientation: portrait) and (max-width: 900px) {
        #gira { display: flex; }
        #portada.open { display: none; }
      }

      /* —— Controles arcade móvil —— */
      #touch {
        display: none;
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 30;
        height: calc(100px + env(safe-area-inset-bottom, 0px));
        padding: 0 16px env(safe-area-inset-bottom, 0px);
        box-sizing: border-box;
        align-items: center;
        justify-content: space-between;
        pointer-events: none;
        background: linear-gradient(transparent, rgba(10, 0, 20, 0.75));
      }
      #touch.open {
        display: flex;
        pointer-events: auto;
      }
      .stick-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }
      .stick-label {
        font-family: 'Press Start 2P', monospace;
        font-size: 7px;
        color: #00f5ff;
        text-shadow: 0 0 6px #00f5ff;
        letter-spacing: 0.05em;
      }
      [data-stick-base] {
        position: relative;
        width: 120px;
        height: 120px;
        border-radius: 50%;
        background:
          radial-gradient(circle at 35% 30%, #3a2060, #1a0033 70%);
        border: 4px solid #2a1040;
        box-shadow:
          inset 0 4px 12px rgba(0, 0, 0, 0.5),
          0 0 16px rgba(255, 0, 110, 0.25),
          inset 0 0 0 2px #ff006e;
        touch-action: none;
      }
      [data-stick-base]::after {
        content: '';
        position: absolute;
        inset: 18px;
        border-radius: 50%;
        border: 2px dashed rgba(0, 245, 255, 0.25);
        pointer-events: none;
      }
      [data-stick-knob] {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 52px;
        height: 52px;
        border-radius: 50%;
        transform: translate(-50%, -50%);
        background: radial-gradient(circle at 35% 28%, #ff4d9a, #cc0066 55%, #880044);
        border: 3px solid #ff006e;
        box-shadow:
          0 4px 0 #660033,
          0 0 14px rgba(255, 0, 110, 0.5),
          inset 0 2px 4px rgba(255, 255, 255, 0.3);
        pointer-events: none;
      }
      .arcade-actions {
        display: flex;
        align-items: flex-end;
        gap: 12px;
      }
      .jump-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }
      #touch-jump {
        appearance: none;
        border: 4px solid #ff006e;
        border-radius: 50%;
        width: 76px;
        height: 76px;
        font: 700 28px Fredoka, sans-serif;
        color: #fff;
        background: radial-gradient(circle at 35% 28%, #ff4d9a, #cc0066);
        box-shadow:
          0 5px 0 #660033,
          0 0 18px rgba(255, 0, 110, 0.5);
        touch-action: manipulation;
      }
      #touch-jump:active {
        transform: translateY(3px);
        box-shadow: 0 2px 0 #660033;
      }
      #btn-mute-game {
        appearance: none;
        border: 3px solid #00f5ff;
        border-radius: 8px;
        width: 44px;
        height: 44px;
        font-size: 20px;
        background: rgba(10, 0, 30, 0.9);
        box-shadow: 0 0 10px rgba(0, 245, 255, 0.35);
        margin-bottom: 8px;
      }
      #btn-mute-game.muted { border-color: #ff006e; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="portada">
      <div class="arcade-cabinet">
        <div class="arcade-grid"></div>
        <div class="arcade-bezel"></div>
      </div>
      <button id="btn-mute-portada" type="button" data-mute-btn aria-label="Silenciar música">🔊</button>
      <div class="portada-layout">
        <div class="portada-copy">
          <p class="arcade-credit">★ INSERT COIN ★</p>
          <p class="presentan">Tia Ivana y Tio Alfredo presentan</p>
          <h1>OLY<br>AVENTURA</h1>
          <p class="sub">En el castillo de hadas</p>
          <button id="btn-jugar" type="button">START</button>
          <button id="btn-install" type="button" hidden>INSTALAR APP</button>
        </div>
        <div class="portada-photo-frame" aria-hidden="true">
          <div class="portada-photo-pixel">
            <img src="assets/oly-portada.png" alt="Olympia" width="480" height="640" />
          </div>
          <div class="portada-photo-scan"></div>
          <div class="portada-photo-glow"></div>
          <div class="portada-player-label"><span>PLAYER 1</span></div>
        </div>
      </div>
      <p id="install-ios-hint" hidden>En iPhone: Compartir → Agregar a pantalla de inicio</p>
      <p class="hint">PANTALLA APAISADA</p>
    </div>
    <audio id="oly-bgm" loop playsinline webkit-playsinline preload="auto" src="assets/sfx/intro.mp3"></audio>
    <div id="banner">
      <div class="banner-card">
        <h2 id="banner-title">Pausa</h2>
        <p id="banner-score" class="banner-score"></p>
        <div class="banner-actions">
          <button id="banner-ok" type="button">Seguir</button>
          <button id="banner-quit" type="button" hidden>Salir al menú</button>
        </div>
      </div>
    </div>
    <button id="btn-exit-game" type="button" aria-label="Salir al menú">SALIR</button>
    <div id="gira">
      <span>↻</span>
      <p>Gira el celular</p>
      <p>Pantalla apaisada</p>
    </div>
    <div id="touch" aria-hidden="true">
      <div class="stick-wrap">
        <div data-stick-base aria-label="Palanca de movimiento">
          <div data-stick-knob></div>
        </div>
        <span class="stick-label">MOVER</span>
      </div>
      <div class="arcade-actions">
        <button id="btn-mute-game" type="button" data-mute-btn aria-label="Silenciar música">🔊</button>
        <div class="jump-wrap">
          <button type="button" id="touch-jump" aria-label="Saltar">A</button>
          <span class="stick-label">SALTAR</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
